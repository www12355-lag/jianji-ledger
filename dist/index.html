<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>简记 · 每一天都清楚</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#172235;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:26px 24px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand i{display:inline-block;width:28px;height:28px;border-radius:9px;background:#6876f7;vertical-align:-5px;margin-right:9px;position:relative}.brand i:after{content:"";position:absolute;width:10px;height:10px;border:3px solid white;border-radius:50%;left:6px;top:6px}.top small{color:#8994a6}.monthbar{display:flex;align-items:center;gap:12px}.monthbar button{border:1px solid #dce3ef;background:white;border-radius:10px;width:34px;height:34px;color:#57657c}.monthbar strong{min-width:115px;text-align:center}.hero{background:#111e36;color:white;border-radius:25px;padding:32px 34px;display:grid;grid-template-columns:1fr auto;gap:25px;box-shadow:0 16px 32px #192b4a1a}.eyebrow{font-size:13px;color:#b9c5d8;margin-bottom:10px}.balance{font-size:42px;font-weight:750;letter-spacing:-2px}.hero .sub{display:flex;gap:32px;margin-top:24px}.sub span{display:block;color:#a9b7cd;font-size:12px;margin-bottom:4px}.sub b{font-size:18px}.hero button{align-self:center;border:0;border-radius:13px;background:#6978fa;color:white;padding:15px 22px;font-weight:700;box-shadow:0 8px 16px #060b2244}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:22px}.card{background:white;border:1px solid #e8edf5;border-radius:20px;padding:24px;box-shadow:0 8px 24px #26355208}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}.card h2{font-size:18px;margin:0}.muted{color:#8b97a9;font-size:13px}.link{border:0;background:none;color:#6272ec;font-weight:700;padding:5px}.budgetrow{padding:14px 0;border-bottom:1px solid #eef1f6}.budgetrow:last-child,.record:last-child{border-bottom:0}.rowtop{display:flex;justify-content:space-between;gap:10px;font-size:14px}.rowtop b{font-weight:700}.track{height:8px;background:#eef1f8;border-radius:10px;margin-top:10px;overflow:hidden}.fill{height:100%;background:#7584ff;border-radius:10px}.fill.warn{background:#f3a44e}.fill.over{background:#ed686b}.record{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #eef1f6}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#edf0ff;color:#6272ec;font-size:19px;flex:none}.recordtext{flex:1;min-width:0}.recordtext b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recordtext small{color:#98a2b1;font-size:12px}.amount{font-weight:750;white-space:nowrap}.amount.income{color:#1eaa81}.empty{padding:26px 0;color:#8d99aa;text-align:center;font-size:14px}.actions{display:flex;gap:7px}.actions button{border:0;background:#f1f4fa;color:#7d899a;border-radius:8px;padding:5px 8px}.foot{color:#9da8b7;font-size:12px;text-align:center;margin-top:32px}.modalback{position:fixed;inset:0;background:#0b152880;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modalback.show{display:flex}.modal{width:min(100%,440px);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:25px;box-shadow:0 30px 80px #07132c50}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal h2{margin:0;font-size:20px}.close{border:0;background:#f1f4fa;border-radius:9px;width:31px;height:31px;color:#627086}.field{display:block;margin:15px 0;font-size:13px;color:#68758a;font-weight:650}.field input,.field select{display:block;width:100%;margin-top:7px;border:1px solid #dce3ed;border-radius:11px;padding:12px;color:#172235;background:white;outline:none}.field input:focus,.field select:focus{border-color:#7886f6;box-shadow:0 0 0 3px #7886f622}.primary{border:0;background:#6776f5;color:white;border-radius:11px;padding:13px 18px;font-weight:700;width:100%;margin-top:10px}.seg{display:flex;background:#f2f4fa;border-radius:11px;padding:4px}.seg button{flex:1;border:0;background:none;padding:10px;border-radius:8px;color:#778398}.seg button.active{background:white;color:#4658d8;box-shadow:0 2px 8px #20304015;font-weight:700}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#17243b;color:white;padding:10px 18px;border-radius:10px;display:none;z-index:10;font-size:13px}.toast.show{display:block}@media(max-width:740px){.app{padding:18px 15px 85px}.top{margin-bottom:20px}.top small{display:none}.brand{font-size:21px}.monthbar{gap:4px}.monthbar strong{min-width:92px;font-size:13px}.monthbar button{width:30px;height:30px}.hero{padding:25px 22px;grid-template-columns:1fr}.balance{font-size:36px}.hero .sub{gap:23px;margin-top:18px}.hero button{width:100%}.grid{grid-template-columns:1fr;gap:15px;margin-top:15px}.card{padding:20px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><i></i>简记</div><div class="monthbar"><button id="prev" aria-label="上个月">‹</button><strong id="month"></strong><button id="next" aria-label="下个月">›</button></div><small>让每一笔都有数</small></header><section class="hero"><div><div class="eyebrow">本月结余</div><div class="balance" id="balance">¥ 0.00</div><div class="sub"><div><span>本月收入</span><b id="income">¥ 0.00</b></div><div><span>本月支出</span><b id="expense">¥ 0.00</b></div></div></div><button id="add">＋ 记一笔</button></section><div class="grid"><section class="card"><div class="cardhead"><h2>分类预算</h2><button class="link" id="setbudget">设置额度</button></div><div id="budgets"></div></section><section class="card"><div class="cardhead"><h2>收支明细</h2><span class="muted" id="count"></span></div><div id="records"></div></section></div><div class="foot">数据仅保存在当前浏览器中 · 金额单位：人民币</div></main><div class="modalback" id="entryModal"><div class="modal"><div class="modalhead"><h2>记一笔</h2><button class="close" data-close="entryModal" aria-label="关闭">×</button></div><div class="seg"><button id="expenseTab" class="active">支出</button><button id="incomeTab">收入</button></div><form id="entryForm"><label class="field">金额<input id="entryAmount" type="number" min="0.01" step="0.01" placeholder="0.00" required></label><label class="field">日期<input id="entryDate" type="date" required></label><label class="field" id="categoryField">类别<select id="entryCategory"></select></label><label class="field">备注<input id="entryNote" maxlength="60" placeholder="例如：午餐"></label><button class="primary">保存记录</button></form></div></div><div class="modalback" id="budgetModal"><div class="modal"><div class="modalhead"><h2>设置月度预算</h2><button class="close" data-close="budgetModal" aria-label="关闭">×</button></div><form id="budgetForm"><label class="field">类别<select id="budgetCategory"></select></label><label class="field">每月额度<input id="budgetAmount" type="number" min="0" step="0.01" required></label><button class="primary">保存额度</button></form></div></div><div class="toast" id="toast"></div><script>
const cats=['餐饮','交通','购物','居住','娱乐','医疗','其他'];const icons={餐饮:'☕',交通:'🚆',购物:'🛍',居住:'⌂',娱乐:'♫',医疗:'✚',其他:'◈'};const $=id=>document.getElementById(id);const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1),entryType='expense';let data;try{data=JSON.parse(localStorage.getItem('jianji-v1'))||{entries:[],budgets:{}}}catch{data={entries:[],budgets:{}}}if(!Array.isArray(data.entries))data.entries=[];if(!data.budgets||typeof data.budgets!=='object')data.budgets={};const money=n=>'¥ '+Number(n||0).toFixed(2);const key=()=>`${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`;const save=()=>localStorage.setItem('jianji-v1',JSON.stringify(data));function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function render(){const ym=key(),list=data.entries.filter(e=>e.date&&e.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);$('month').textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;const inc=list.filter(e=>e.type==='income').reduce((s,e)=>s+Number(e.amount),0),exp=list.filter(e=>e.type==='expense').reduce((s,e)=>s+Number(e.amount),0);$('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);$('count').textContent=`共 ${list.length} 笔`;const bs=data.budgets[ym]||{};$('budgets').innerHTML=cats.filter(c=>Number(bs[c])>0).map(c=>{const used=list.filter(e=>e.type==='expense'&&e.category===c).reduce((s,e)=>s+Number(e.amount),0),limit=Number(bs[c]),pct=used/limit*100;return `<div class="budgetrow"><div class="rowtop"><b>${icons[c]} ${c}</b><span>${money(used)} <span class="muted">/ ${money(limit)}</span></span></div><div class="track"><div class="fill ${pct>=100?'over':pct>=80?'warn':''}" style="width:${Math.min(100,pct)}%"></div></div></div>`}).join('')||'<div class="empty">还没有设置预算，点右上角开始设置</div>';$('records').innerHTML=list.map(e=>`<div class="record"><div class="icon">${e.type==='income'?'¥':icons[e.category]||icons.其他}</div><div class="recordtext"><b></b><small>${e.date} · ${e.type==='income'?'收入':e.category}</small></div><div class="amount ${e.type==='income'?'income':''}">${e.type==='income'?'+':'−'}${money(e.amount)}</div><div class="actions"><button data-delete="${e.id}" aria-label="删除记录">×</button></div></div>`).join('')||'<div class="empty">这个月还没有记录，点「记一笔」开始</div>';[...$('records').querySelectorAll('.record')].forEach((row,i)=>row.querySelector('b').textContent=list[i].note|| (list[i].type==='income'?'月度收入':list[i].category))}function open(id){$(id).classList.add('show')}function close(id){$(id).classList.remove('show')}function setType(type){entryType=type;$('expenseTab').classList.toggle('active',type==='expense');$('incomeTab').classList.toggle('active',type==='income');$('categoryField').style.display=type==='income'?'none':'block'}$('entryCategory').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');$('budgetCategory').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('add').onclick=()=>{$('entryDate').value=new Date().toLocaleDateString('en-CA');$('entryForm').reset();$('entryDate').value=new Date().toLocaleDateString('en-CA');setType('expense');open('entryModal');$('entryAmount').focus()};$('setbudget').onclick=()=>{$('budgetCategory').value=cats[0];$('budgetAmount').value=(data.budgets[key()]||{})[cats[0]]??'';open('budgetModal')};$('budgetCategory').onchange=()=>{$('budgetAmount').value=(data.budgets[key()]||{})[$('budgetCategory').value]??''};$('expenseTab').onclick=()=>setType('expense');$('incomeTab').onclick=()=>setType('income');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.modalback').forEach(m=>m.onclick=e=>{if(e.target===m)close(m.id)});$('entryForm').onsubmit=e=>{e.preventDefault();const amount=Number($('entryAmount').value);if(!Number.isFinite(amount)||amount<=0)return;data.entries.push({id:Date.now()+Math.random(),type:entryType,amount,date:$('entryDate').value,category:entryType==='expense'?$('entryCategory').value:'',note:$('entryNote').value.trim()});save();close('entryModal');render();toast('已保存记录')};$('budgetForm').onsubmit=e=>{e.preventDefault();const amount=Number($('budgetAmount').value);if(!Number.isFinite(amount)||amount<0)return;data.budgets[key()]??={};data.budgets[key()][$('budgetCategory').value]=amount;save();close('budgetModal');render();toast('预算已更新')};$('records').onclick=e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(!confirm('确定删除这笔记录吗？'))return;data.entries=data.entries.filter(x=>String(x.id)!==b.dataset.delete);save();render();toast('记录已删除')};render();
</script></body></html>
